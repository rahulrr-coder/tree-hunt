services:
  - type: web
    name: tree-hunt
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - { key: MODEL_API_KEY, sync: false }
      - { key: MODEL_BASE_URL, value: "https://generativelanguage.googleapis.com/v1beta/openai" }
      - { key: MODEL_NAME, value: gemma-3-27b-it }
      - { key: MONGODB_URI, sync: false }
      - { key: MONGODB_DB, value: treehunt }
      - { key: VERIFY_RATE_LIMIT_PER_HOUR, value: "20" }
      - { key: LLM_BUDGET_PER_HOUR, value: "400" }
      - { key: APP_TIMEZONE, value: Asia/Kolkata }
